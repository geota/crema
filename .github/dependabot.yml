# Dependabot version updates — keep each ecosystem current on a weekly cadence.
# Minor+patch bumps are grouped into ONE PR per ecosystem to cut noise; majors
# open individually for review. PR titles use a `chore(deps…)` / `ci(deps…)`
# prefix with `include: scope` so they pass the `pr-title` workflow's
# Conventional-Commits check (feat|fix|chore|docs|refactor|test|ci).
#
# NOTE: this file only configures *version* updates. Dependabot *security*
# updates (auto-PRs for known CVEs — what would have caught the vite advisory)
# are a separate toggle: Settings → Code security → "Dependabot security
# updates" (or `gh api -X PUT /repos/geota/crema/automated-security-fixes`).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # ── Rust core (Cargo workspace at /core) ─────────────────────────────
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── Web PWA (pnpm at /web) ───────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # `/web` CI runs `pnpm install --frozen-lockfile` under a minimumReleaseAge
    # supply-chain policy (~1 day) that rejects lockfile entries published inside
    # the cutoff. This cooldown holds a bump until the deps it updates have aged
    # past that window, cutting the red-on-first-run churn. CAVEAT: it applies to
    # the deps dependabot bumps, NOT to daily-churning transitive browser-data
    # packages (browserslist / electron-to-chromium / baseline-browser-mapping)
    # that get re-resolved into the lockfile — those can still trip the policy;
    # a re-run / `@dependabot rebase` clears them once they age out.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native (tsgo) compiler line — svelte-check /
      # svelte2tsx can't drive it yet (language-tools #2733; `svelte-check`
      # dies with `useCaseSensitiveFileNames` undefined, PR #28), and tsgo
      # lacks `rootDirs`, which SvelteKit's generated types require
      # (sveltejs/kit #13970). Un-ignore once language-tools ships TS-Go
      # support and the 6→7 migration is done deliberately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # ── Android (Gradle at /android — build.gradle.kts + version catalog) ─
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── GitHub Actions (workflow `uses:` pins) ───────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain` uses its git tag AS the Rust toolchain to
      # install, so dependabot can bump the pin to a far-future tag (e.g.
      # 1.100.0) that maps to a Rust release that does not exist yet — then
      # `rustup toolchain install` 404s and both the rust and web(wasm) jobs
      # fail (PR #68). Bump this action deliberately/manually instead.
      - dependency-name: dtolnay/rust-toolchain
