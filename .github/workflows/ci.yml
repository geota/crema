# Crema CI — quality gates for the Rust core and the SvelteKit web shell.
#
# This workflow runs on every PR to `main` and on direct pushes to `main`,
# plus two schedules: a weekly one that runs ONLY the advisory `audit` job and
# a nightly one that runs ONLY the relay `fuzz` job (every other job is guarded
# with `if: github.event_name != 'schedule'`). It does NOT
# deploy, and neither does a push to `main`: the web deploys to Cloudflare
# Pages only from release.yml on a `v*.*.*` tag. See DEPLOY.md.
#
# The two main jobs (`rust` and `web`) run in parallel for shorter wall-clock
# time. We don't gate them on per-job path filters because the web shell
# depends on the Rust core (via wasm) and they share a cargo cache — running
# both on every PR is cheap once warm and avoids "PR didn't run check X"
# foot-guns when a change touches both halves.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly advisory audit (Mondays 07:00 UTC) so a new advisory surfaces even
  # in a week with no merges. Only the `audit` job runs on this trigger.
  # Nightly (03:30 UTC): only the de1-relay `fuzz` job.
  schedule:
    - cron: '0 7 * * 1'
    - cron: '30 3 * * *'

# Cancel in-flight CI runs on the same PR when a new commit lands;
# leave push-to-main runs alone so each merge gets a clean signal. The weekly
# schedule gets its own group so it never queues behind (or bumps) a main push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Rust core gates: fmt, clippy, tests, builtin-ID idempotency check.
  # ─────────────────────────────────────────────────────────────────────
  rust:
    name: rust (core)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned (not `stable`) to match core/Cargo.toml's rust-version — F-Droid's
      # reproducible-build recipe needs a fixed compiler, not a floating channel.
      - name: Install Rust toolchain (stable + wasm32 + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Swatinem/rust-cache handles the cargo registry + git + target dirs
      # better than hand-rolled actions/cache for Rust. Keyed on Cargo.lock.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          shared-key: rust-core

      - name: cargo fmt --check
        working-directory: core
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        working-directory: core
        run: cargo test --workspace

      # de1-relay's seeded vectors (relay v4 spec §3.7, AC-1): regenerating them
      # from the fixed seeds must reproduce tests/vectors/v4.json byte for byte.
      - name: relay vectors are fresh
        working-directory: core
        run: cargo run -p de1-relay --features test-seeds --example gen_vectors -- --check

      # AC-19: de1-relay draws no OS entropy, so getrandom (and ring) must never
      # appear in its normal dependency tree; AC-46: the pinned versions resolve.
      - name: relay has no ambient entropy
        working-directory: core
        run: |
          tree="$(cargo tree -p de1-relay -e normal --prefix none)"
          echo "$tree"
          if echo "$tree" | grep -Eq '^(getrandom|ring) '; then
            echo "::error::getrandom or ring in the de1-relay tree"; exit 1
          fi
          echo "$tree" | grep -q '^snow v0.10.0'
          echo "$tree" | grep -q '^spake2 v0.4.0'

      # gen-builtin-ids is idempotent: it stamps stable UUID v7 IDs into
      # builtin.json once, and is a no-op afterward. If running it produces
      # any diff, either (a) the tool isn't idempotent (bug) or (b) somebody
      # hand-edited builtin.json without re-running the generator.
      - name: gen-builtin-ids idempotency
        working-directory: core
        run: |
          cargo run -p de1-domain --bin gen-builtin-ids
          git diff --exit-code de1-domain/profiles/builtin.json

      # The typeshare bindings (core/bindings/*.{kt,ts}) and each shell's generated
      # copy — web (web/src/lib/core/crema-core.ts) and Android
      # (android/app/src/main/java/coffee/crema/core/CremaCoreTypes.kt) — must match
      # the current #[typeshare] Rust types. Re-running generate-bindings.sh is a
      # no-op on a fresh tree; any diff means someone changed a Rust type without
      # regenerating (so a shell's type surface is stale). Pinned to the generator
      # version stamped in the file headers so the output is stable.
      - name: typeshare bindings freshness
        run: |
          cargo install typeshare-cli --version 1.13.4 --locked
          core/generate-bindings.sh
          git diff --exit-code core/bindings web/src/lib/core/crema-core.ts android/app/src/main/java/coffee/crema/core/CremaCoreTypes.kt

  # ─────────────────────────────────────────────────────────────────────
  # Rust supply-chain gate (relay v4 spec §3.1, AC-58). BLOCKING, unlike the
  # advisory `audit` job below: any RustSec advisory in the core graph (one
  # documented exception in core/deny.toml), getrandom/ring under de1-relay
  # (snow's `std` must never be on), or snow/spake2 off their exact pins
  # fails the PR.
  # ─────────────────────────────────────────────────────────────────────
  deny:
    name: deny (supply chain)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check advisories bans
        working-directory: core
        run: cargo deny check advisories bans

  # ─────────────────────────────────────────────────────────────────────
  # de1-relay fuzzing (relay v4 spec §3.7, AC-21): each cargo-fuzz target for
  # 60 s, nightly only. The seed corpus also replays in `cargo test` on every
  # PR (tests/fuzz_corpus.rs). New inputs go to a scratch corpus; a crash
  # uploads its artifact and fails the job. -len_control=0 -max_len=4096 lets
  # inputs grow to full message sequences from the first second of a 60 s run.
  # ─────────────────────────────────────────────────────────────────────
  fuzz:
    name: fuzz (de1-relay)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '30 3 * * *'
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_hub_ws, fuzz_remote_ws, fuzz_transport_records, fuzz_client_hello]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cargo-fuzz needs nightly (sanitizer flags); the fuzz project has its own lockfile.
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: cargo fuzz run ${{ matrix.target }} (60 s)
        working-directory: core/de1-relay/fuzz
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/artifacts"
          cargo fuzz run ${{ matrix.target }} "$RUNNER_TEMP/corpus" corpus/${{ matrix.target }} -- \
            -max_total_time=60 -len_control=0 -max_len=4096 -artifact_prefix="$RUNNER_TEMP/artifacts/"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts

  # ─────────────────────────────────────────────────────────────────────
  # Web shell gates: install, build wasm bundle, svelte-check, build.
  # Depends on the Rust core indirectly (`pnpm wasm` rebuilds de1-wasm).
  # ─────────────────────────────────────────────────────────────────────
  web:
    name: web (svelte)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable + wasm32)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target (shared with rust job)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          shared-key: rust-core

      # Prebuilt wasm-pack binary — saves ~3 min over `cargo install`.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Build the wasm bundle first — `pnpm check` and `pnpm build` both
      # depend on it (the Svelte shell imports from src/lib/wasm/).
      - name: Build wasm bundle
        working-directory: web
        run: pnpm wasm

      # `pnpm check` runs `svelte-kit sync` then svelte-check; fails on any error.
      - name: Type-check + svelte-check
        working-directory: web
        run: pnpm check

      - name: Build (adapter-static)
        working-directory: web
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────────
  # Advisory dependency audit. Runs on main pushes and weekly (no PR noise).
  # continue-on-error keeps a flared-up transitive advisory from blocking
  # merges; findings still surface as annotations on the run and in the job
  # summary. Transitive web advisories are fixed by security-lockfile.yml.
  # ─────────────────────────────────────────────────────────────────────
  audit:
    name: audit (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.schedule == '0 7 * * 1'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: core
        run: cargo audit
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: pnpm audit (prod, high+)
        working-directory: web
        # SEC6: gate the advisory on high/critical severity in production deps
        # only — devDep advisories don't ship. Stays advisory (continue-on-error)
        # by the job's design: a flared-up transitive advisory annotates the run
        # but never blocks a merge.
        run: |
          set +e
          pnpm audit --prod --audit-level=high > "$RUNNER_TEMP/audit-prod.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/audit-prod.txt"
          { echo "### pnpm audit --prod --audit-level=high (exit $code)"; echo '```'; cat "$RUNNER_TEMP/audit-prod.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        continue-on-error: true

      - name: pnpm audit (all deps, high+)
        working-directory: web
        # Same gate over dev/build deps too (Tailwind, jsdom, workbox…): they
        # don't ship, but they run on dev machines and in CI, and the prod-only
        # step above never reports them. Advisory only, like the step above.
        run: |
          set +e
          pnpm audit --audit-level=high > "$RUNNER_TEMP/audit-all.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/audit-all.txt"
          { echo "### pnpm audit --audit-level=high, all deps (exit $code)"; echo '```'; cat "$RUNNER_TEMP/audit-all.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        continue-on-error: true
