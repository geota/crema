[package]
name = "de1-ffi"
version = "0.1.0"
description = "Crema UniFFI bridge — exposes the de1-app core to the Android (Kotlin) shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
de1-app = { path = "../de1-app" }
de1-domain = { path = "../de1-domain" }
de1-protocol = { path = "../de1-protocol" }
serde_json = { workspace = true }
uniffi = { version = "0.32.0", features = ["cli"] }
# Relay v4 (spec §3.5): the secure channel, OS entropy for its seeds (the
# getrandom(2) syscall on Android; already in the lockfile through uuid), and
# zeroize for the key and code buffers this bridge owns.
de1-relay = { path = "../de1-relay" }
getrandom = "0.4"
zeroize = "1"

[features]
# The deterministic `*_for_tests` relay constructors (spec §2.11). Only the
# host build for the JVM unit tests (cargoBuildHostCore) enables it; the APK's
# library never does, and CI's release-symbols check proves it.
test-seeds = ["de1-relay/test-seeds"]

[dev-dependencies]
serde_json = { workspace = true }

# This crate intentionally does NOT use `[lints] workspace = true`: UniFFI's
# generated FFI scaffolding requires `unsafe`, which the workspace lint table
# forbids. The lints below mirror the workspace's, minus `unsafe_code`.
[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
