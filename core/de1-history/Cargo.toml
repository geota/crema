# The SQLite history's core (#310, `.scratch/history-sqlite/SPEC.md`): the
# rules that turn a shot row into columns, the typed queries and their SQL, the
# cursor, the change kinds and a reference filter the SQL is tested against.
#
# C1 is the pure half only. Nothing here opens a database.
[package]
name = "de1-history"
version = "0.1.0"
description = "Crema shot history: derived columns, typed queries, SQL text and reference rules"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
de1-domain = { path = "../de1-domain" }
serde.workspace = true
serde_json.workspace = true
# NFD, for the search fold (SPEC §5). Pure tables, no IO.
unicode-normalization = "0.1.24"
# The store (SPEC §1, decision B): SQLite compiled in, so both shells run one
# SQLite version with FTS5 and trigram. Native only until C4 adds the wasm VFS.
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "cache", "backup"], optional = true }

[features]
# The `rusqlite` store (`store`): opens and writes the database. Off by
# default, so the pure half builds without SQLite.
store = ["dep:rusqlite"]
# A fault hook for tests (PLAN C2): fail at a named point. Never in a shipped
# build.
faults = ["store"]
# The reference rules (`reference`), for the stage-1 dev oracle (SPEC §3, N7).
# `de1-wasm` and `de1-ffi` turn it on only in dev and test builds, so the
# production bundles link none of this crate.
dev-oracle = []

[dev-dependencies]
# The crate's own tests use the reference rules.
de1-history = { path = ".", features = ["dev-oracle", "store", "faults"] }
# Temp dirs for the store's tests: real SQLite files, no mocks.
tempfile = "3"

[lints]
workspace = true

# PLAN B1's native benchmarks: `#[ignore]` timing tests, no criterion. Built
# by `cargo test` so they can't rot (the generator's own check runs there);
# the timings run only with `--ignored`, in release (see the file's header).
[[bench]]
name = "history"
test = true
