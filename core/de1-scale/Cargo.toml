[package]
name = "de1-scale"
version = "0.1.0"
description = "Bluetooth LE codecs for the coffee scales supported by Crema"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Optional: `serde` derives on the public capability descriptor, behind the
# `serde` feature — enabled by de1-app for the JSON FFI surface.
serde = { workspace = true, optional = true }
# The #[typeshare] attribute only: the macro crate, without the runtime crate's chrono (RUSTSEC-2026-0543).
typeshare = { package = "typeshare-annotation", version = "1.0.5" }

[features]
# Adds `serde::{Serialize, Deserialize}` to [`ScaleCapabilities`] — enabled by
# de1-app so the capability descriptor crosses the JSON FFI boundary.
serde = ["dep:serde"]

[lints]
workspace = true
