# pnpm settings. pnpm 11 stopped reading the "pnpm" field in package.json and
# moved settings here (https://pnpm.io/settings).
#
# Security overrides: force patched versions of vulnerable *transitive* deps
# that the direct parent hasn't picked up yet. Drop an entry once the parent
# ships a release pulling the patched version itself.
overrides:
  undici: '^7.30.1' # <7.30.1 advisories, via jsdom (test dep)
  js-yaml: '^4.3.2' # <4.3.2 advisories, via @redocly/openapi-core (codegen)

# Local patches (`pnpm patch` / `pnpm patch-commit`) for advisories with no
# fixed release. Each is pinned to one version: when the package moves off it,
# every install fails with ERR_PNPM_UNUSED_PATCH, so drop the entry and its file
# once a fixed release is in the lockfile. scripts/fix-transitive-advisories.mjs
# leaves these packages alone.
patchedDependencies:
  # GHSA-gcqx-w48m-w2h4 prototype poisoning in mergeObject (build-time only, via
  # @sveltejs/vite-plugin-svelte and @rollup/plugin-node-resolve). Upstream has
  # no fix; src/lib/security/deepmerge-patch.vitest.ts covers the patch.
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
